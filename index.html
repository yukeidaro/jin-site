<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0;url=human/">
<title>Jin AI — Structured for AI. Simple for people.</title>
<meta name="description" content="Jin AI is a visual workspace for AI-generated work, with Markdown as the spine.">
<link rel="canonical" href="https://jinai.md/human/">
<link rel="icon" href="brand/jin-mark.svg" type="image/svg+xml">
<style>
:root {
  --cp-bg: #f5f3ef; --cp-surface: #ffffff; --cp-surface-2: #eeece8;
  --cp-text: #242424; --cp-text-muted: #6b6b6b; --cp-border: #d8d6d1;
  --cp-accent: #1659e9; --cp-accent-hover: #1048c4; --cp-accent-subtle: #edf3ff;
  --cp-success: #17834f; --cp-warning: #9a6700; --cp-danger: #cf222e;
  --cp-radius: 4px; --cp-radius-lg: 6px;
  --cp-shadow: 0 1px 3px rgba(0,0,0,.12); --cp-shadow-lg: 0 8px 24px rgba(0,0,0,.16);
}
html[data-theme="dark"] {
  --cp-bg: #1b1b1b; --cp-surface: #252525; --cp-surface-2: #2f2f2f;
  --cp-text: #f1f1f1; --cp-text-muted: #a7a7a7; --cp-border: #3f3f3f;
  --cp-accent: #61a6fa; --cp-accent-hover: #8fc1fb; --cp-accent-subtle: #1d2a3d;
  --cp-success: #3fb950; --cp-warning: #d29922; --cp-danger: #f85149;
  --cp-shadow: 0 1px 3px rgba(0,0,0,.4); --cp-shadow-lg: 0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cp-bg);color:var(--cp-text);font-family:"Segoe UI",Aptos,Calibri,sans-serif}
main{max-width:720px;margin:64px auto;padding:0 24px}
.status{border-left:3px solid var(--cp-accent);padding:12px 16px;background:var(--cp-surface);box-shadow:var(--cp-shadow)}
p{margin:0;color:var(--cp-text-muted)}
a{color:var(--cp-accent)}
</style>
</head>
<body>
<main>
  <div class="status">
    <p>Opening the Jin AI page for humans. <a href="human/">Continue</a></p>
  </div>
</main>
<script>location.replace('human/');</script>
</body>
</html>
