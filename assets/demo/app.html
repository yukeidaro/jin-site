let step=0,connected=false,connecting=false,role='Sales',panel=null,playing=false,start=0,timer=null,connectionTimer=null,eventIndex=0;let policies=items.map(x=>x[2]);let target='Open Canvas';let result='';

function resize(){let s=Math.min(innerWidth/1440,innerHeight/900);$('stage').style.transform=`scale(${s})`;$('stage').style.left=(innerWidth-1440*s)/2+'px';$('stage').style.top=(innerHeight-900*s)/2+'px'}addEventListener('resize',resize);resize();
function render(){let admin=!heroEmbed&&step>1;$('stage').classList.toggle('admin-theme',admin);$('stage').classList.toggle('employee-theme',!admin);$('chromeTitle').innerHTML=admin?'<span class="address">▣ &nbsp; admin.jin-ai.example / contoso</span>':'Jin AI · Employee workspace';$('navLabel').textContent=admin?'Administration':'Your workspace';$('userAvatar').textContent=admin?'I':'M';$('userName').innerHTML=admin?'Iris<div class="tiny">Workspace admin</div>':'Maya<div class="tiny">Sales · Employee</div>';$('nav').innerHTML=(admin?[[2,'◫','By role'],[3,'◇','What can move']]:[[0,'⊞','Connections'],[1,'▤','My AI harnesses']]).map(([i,icon,name])=>`<button class="navbtn ${step===i?'active':''}" data-step="${i}"><span>${icon}</span>${name}</button>`).join('');const stepNames=heroEmbed?['Connect','Categories']:['Connect','Categories','By role','What can move'];$('steps').innerHTML=stepNames.map((name,i)=>`<button class="step ${step===i?'active':''}" data-step="${i}"><b>${i+1}</b>${name}</button>`).join('');const views=heroEmbed?[connectView,categoryView]:[connectView,categoryView,roleView,policyView];$('main').innerHTML=views[step]();document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{stop();go(+b.dataset.step)});bind();}
function header(k,title,sub,extra=''){return `<div class="eyebrow">${k}</div><div class="heading"><h1>${title}</h1>${extra}</div><p>${sub}</p>`}
function connectView(){return header('01 / Connect','Connect once.','Jin AI connects to your AI tools through MCP.','<span class="pill">● Local workspace</span>')+`<div class="connect-layout"><section class="tool-picker"><div class="picker-heading"><h2>Your AI tools</h2><span class="tiny">10 connections</span></div><p class="picker-sub">Choose an AI tool to connect.</p><div class="picker-label">AI assistants</div><div class="tool-options">${connectTools.slice(0,3).map(toolOption).join('')}</div><div class="picker-label">Coding & agent tools</div><div class="tool-options">${connectTools.slice(3).map(toolOption).join('')}</div><div class="picker-note">Interactive preview · Simulated connections</div></section><div class="empty connect-detail"><div class="empty-icon"><img class="selected-ai-logo" src="${toolLogos[selectedTool]}" alt="${selectedTool} logo"></div><div class="eyebrow">${selectedTool}</div><h2>Connect your AI harness.</h2><p>Instructions, skills, memory and connected tools<br>that make AI work for your role.</p><button class="primary" id="connect" ${connecting||connected?'disabled':''}>${connected?'✓ '+selectedTool+' connected':connecting?'Connecting…':'Connect '+selectedTool}</button><div class="connection" aria-live="polite">${connecting?'◌ Connecting through MCP':connected?'✓ '+selectedTool+' connected':''}</div>${connected?'<button class="secondary" id="viewSetup">Explore my harness →</button>':'<div class="footnote">MCP connection · Company policies stay in place</div>'}<div class="connection-note">Demo only. No account access or data transfer.</div></div></div><p class="footnote" style="text-align:center">Demo workspace. All people and data are fictional.</p>`}
function toolOption(name){return `<button class="tool-option ${selectedTool===name?'chosen':''}" data-connect-tool="${name}" aria-pressed="${selectedTool===name}"><span class="tool-monogram"><img class="ai-logo" src="${toolLogos[name]}" alt="${name} logo"></span><span>${name}</span><span class="tool-ready">${connectedTools.has(name)?'✓ Connected':'Ready'}</span></button>`}
function categoryView(){return header('02 / Categories','See every harness by category.','Skills, instructions, memory and MCP settings, sorted for each person.',`<span class="pill">✓ ${selectedTool} connected</span>`)+`<div class="stats"><div class="stat"><strong>10</strong><span>Harness parts discovered</span></div><div class="stat"><strong>9</strong><span>Categories</span></div><div class="stat"><strong>${policies.filter(x=>!x).length}</strong><span>Parts that can move</span></div></div><div class="list">${categories.map((c,k)=>`<div class="group">${c}</div>${items.map((x,i)=>x[1]===k?`<button class="row" data-item="${i}"><span class="file-icon">▧</span><span class="row-name">${x[0]}</span>${tag(policies[i])}<span class="date">${x[3]}</span><span style="color:#aaaab4">›</span></button>`:'').join('')}`).join('')}</div>${panel!==null?drawer():''}`}
const weeklyUsage=[['ChatGPT',24],['Claude',12],['ChatGPT',8],['Claude Code',18],['Cursor',21],['ChatGPT',16],['Claude',9],['Codex',4],['Claude Code',7],['ChatGPT',11]];
function drawer(){let x=items[panel],usage=weeklyUsage[panel];return `<aside class="drawer"><button class="close" id="close" aria-label="Close detail">✕</button><div class="eyebrow" style="margin-top:12px">Harness part preview</div><h2>${x[0]}</h2>${tag(policies[panel])}<div class="detail-label">${categories[x[1]]}</div><pre class="code">${x[4]}</pre><div class="usage-summary"><div class="usage-tool"><img src="${toolLogos[usage[0]]}" alt="${usage[0]} logo"><div><div class="tiny">Mainly used in</div><strong>${usage[0]}</strong></div></div><div class="weekly-count"><strong>${usage[1]}</strong><span>uses this week</span></div><div class="usage-period">Oct 12-18, 2026 · Demo usage</div></div><div class="detail-label">Last used</div><p style="font-size:12px">${x[3]}</p><div class="insight">${policies[panel]?'Contains company context. Available only within approved AI tools.':'A reusable harness part. Also usable in your personal AI.'}</div></aside>`}
function roleView(){return header('03 / By role','See it by role.','Which harnesses each role uses, and how often.','<span class="pill">Contoso · 4 roles</span>')+`<div class="stats"><div class="stat"><strong>48</strong><span>Connected employees</span></div><div class="stat"><strong>126</strong><span>Reusable harnesses</span></div><div class="stat"><strong>84%</strong><span>Weekly adoption</span></div></div><div class="roles"><div class="role-list"><div class="navlabel">Teams</div>${Object.keys(roles).map((r,i)=>`<button class="role ${r===role?'selected':''}" data-role="${r}">${r}<span>${[16,12,14,6][i]}</span></button>`).join('')}</div><div class="usage"><div class="usage-head"><h2>${role}'s most-used harnesses</h2><span class="tiny">LAST 30 DAYS</span></div>${roles[role].map(([n,who,v])=>`<div class="bar-item"><div class="bar-head"><span>${n}</span><span style="color:#555563">${v}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${v}%"></div></div><div class="tiny">Built by ${who} <span style="float:right">of connected team members</span></div></div>`).join('')}</div></div><div class="insight">↗ &nbsp; Hand the best harnesses to colleagues and successors.</div><span class="preview">Preview. Admin console · Fictional data</span>`}
function policyView(){return header('04 / What can move','Decide what can move.','Parts marked confidential connect only to the AI tools you approve.','<span class="pill">● Policy enforcement on</span>')+`<div class="policy-grid"><section class="card"><h2>Harness policies</h2><p style="font-size:12px;margin-top:7px">Click a label to change its policy.</p><div class="table-head"><span>Harness part</span><span>Movement policy</span></div>${[0,1,2,4,5,6].map(i=>`<div class="policy-row"><span>${items[i][0]}</span><button data-policy="${i}" aria-label="Change policy for ${items[i][0]}">${tag(policies[i])}</button></div>`).join('')}<div class="insight" style="margin-top:20px">🔒 &nbsp; Confidential context stays inside your approved tool boundary.</div></section><section><div class="card"><h2>AI tools</h2><p style="font-size:12px;margin-top:7px">Company-approved destinations</p>${['Claude Code','Atlas AI','Open Canvas'].map((t,i)=>`<div class="tool-row"><span class="tool-icon">${['⌘','△','□'][i]}</span><span style="font-size:12px">${t}</span><span class="pill ${i===2?'bad':''}">${i===2?'Not approved':'✓ Approved'}</span></div>`).join('')}</div><div class="transfer"><div style="font-size:13px;font-weight:600">Try a connection</div><p style="font-size:11px">Check a harness part against your company's policy.</p><select id="part" aria-label="Harness part">${items.map((x,i)=>`<option value="${i}" ${i===1?'selected':''}>${x[0]}</option>`).join('')}</select><select id="target" aria-label="Destination AI tool">${['Claude Code','Atlas AI','Open Canvas'].map(t=>`<option ${t===target?'selected':''}>${t}</option>`).join('')}</select><button class="primary" id="test" style="width:100%">Connect harness part →</button><div id="result" aria-live="polite">${result}</div></div></section></div><span class="preview">Preview. Admin console · Fictional data</span>`}
function bind(){document.querySelectorAll('[data-connect-tool]').forEach(b=>b.onclick=()=>{if(playing)stop();clearTimeout(connectionTimer);selectedTool=b.dataset.connectTool;connecting=false;connected=connectedTools.has(selectedTool);render()});if($('connect'))$('connect').onclick=connect;if($('viewSetup'))$('viewSetup').onclick=()=>go(1);document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{panel=+b.dataset.item;render()});if($('close'))$('close').onclick=()=>{panel=null;render()};document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});document.querySelectorAll('[data-policy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.policy;policies[i]=!policies[i];result='';render()});if($('target'))$('target').onchange=e=>{target=e.target.value;result='';$('result').innerHTML=''};if($('test'))$('test').onclick=check;}
function connect(){if(connecting||connected)return;connecting=true;render();connectionTimer=setTimeout(()=>{connected=true;connectedTools.add(selectedTool);connecting=false;render()},1400)}
function check(){let i=+$('part').value;target=$('target').value;let blocked=policies[i]&&target==='Open Canvas';result=blocked?'<div class="alert"><strong>🔒 Connection stopped</strong><br>Confidential parts connect only to approved AI tools.</div>':`<div class="alert success"><strong>✓ Connection allowed</strong><br>${items[i][0]} can connect to ${target}.</div>`;$('result').innerHTML=result;}
function go(n){step=Math.max(0,Math.min(heroEmbed?1:3,n));panel=null;result='';if(step===1){connected=true;connecting=false;clearTimeout(connectionTimer)}render()}
function move(selector){let el=document.querySelector(selector);if(!el)return;if(!heroEmbed)el.scrollIntoView({block:'nearest'});let r=el.getBoundingClientRect(),s=$('stage').getBoundingClientRect(),x=(r.left-s.left+r.width*.6)/(s.width/1440),y=(r.top-s.top+r.height*.55)/(s.height/$('stage').offsetHeight);if(heroEmbed)$('cursor').style.transform=`translate(${x}px,${y}px)`;else{$('cursor').style.left=x+'px';$('cursor').style.top=y+'px'}}
function click(selector){let el=document.querySelector(selector);if(el){if(heroEmbed)el.onclick();else el.click();$('cursor').classList.add('click');if(!heroEmbed)setTimeout(()=>$('cursor').classList.remove('click'),250)}}
const events=[[1,()=>move('#connect')],[2,()=>click('#connect')],[5,()=>move('#viewSetup')],[6,()=>click('#viewSetup')],[8,()=>move('[data-item="1"]')],[9,()=>click('[data-item="1"]')],[13,()=>move('#close')],[14,()=>click('#close')],[15,()=>move('[data-item="2"]')],[16,()=>click('[data-item="2"]')],[19,()=>{go(2);move('[data-role="Sales"]')}],[23,()=>move('[data-role="Engineering"]')],[24,()=>click('[data-role="Engineering"]')],[27,()=>move('[data-role="Customer Success"]')],[28,()=>click('[data-role="Customer Success"]')],[31,()=>{go(3);move('#target')}],[34,()=>move('#test')],[35,()=>click('#test')],[40,()=>{target='Atlas AI';$('target').value=target;move('#target')}],[42,()=>{move('#test');click('#test')}]];
function stop(){playing=false;clearInterval(timer);$('cursor').style.display='none';$('play').textContent='▶ Play tour';$('time').textContent='45s tour';$('progress').style.width='0'}
function play(){if(playing){stop();return}clearTimeout(connectionTimer);selectedTool='Claude Code';connectedTools.clear();connected=false;connecting=false;policies=items.map(x=>x[2]);target='Open Canvas';role='Sales';go(0);playing=true;eventIndex=0;start=performance.now();$('cursor').style.display='block';$('cursor').style.left='1080px';$('cursor').style.top='650px';$('play').textContent='Ⅱ Stop tour';timer=setInterval(()=>{let t=(performance.now()-start)/1000;$('progress').style.width=Math.min(t/45,1)*1440+'px';$('time').textContent=`${Math.min(45,Math.floor(t))} / 45s`;while(eventIndex<events.length&&t>=events[eventIndex][0])events[eventIndex++][1]();if(t>=45){stop();$('time').textContent='Tour complete'}},100)}
$('play').onclick=play;$('prev').onclick=()=>{stop();go(step-1)};$('next').onclick=()=>{stop();go(step+1)};document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){stop();go(step+1)}if(e.key==='ArrowLeft'){stop();go(step-1)}if(e.key==='Escape'){panel=null;stop();render()}if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();play()}});render();
</script>
<script>
if (heroEmbed) {
  document.body.inert = true;
  const phases = [
    { scene: 0, target: '[data-step="0"]', duration: 650 },
    { scene: 0, target: '[data-connect-tool="ChatGPT"]', duration: 4000 },
    { scene: 0, target: '[data-connect-tool="Claude Code"]', duration: 1200 },
    { scene: 1, target: '[data-step="1"]', duration: 5000 }
  ];
  const travel = 650;
  let phase = 1;
  let approaching = false;
  let remaining = phases[phase].duration - travel;
  let deadline = 0;
  let timeout = null;
  let requestedPlay = false;
  $('cursor').addEventListener("animationend", () => $('cursor').classList.remove("click"));
  function schedule() {
    deadline = performance.now() + remaining;
    timeout = setTimeout(() => {
      timeout = null;
      if (approaching) {
        click(phases[phase].target);
        remaining = phases[phase].duration - travel;
      } else {
        phase = (phase + 1) % phases.length;
        move(phases[phase].target);
        remaining = travel;
      }
      approaching = !approaching;
      schedule();
    }, remaining);
  }
  function updatePlayback() {
    const running = requestedPlay && !document.hidden;
    document.documentElement.classList.toggle("embed-paused", !running);
    for (const animation of document.getAnimations()) {
      if (running) animation.play();
      else animation.pause();
    }
    if (!running && timeout !== null) {
      remaining = Math.max(0, deadline - performance.now());
      clearTimeout(timeout);
      timeout = null;
    } else if (running && timeout === null) {
      schedule();
    }
  }
  addEventListener("message", event => {
    if (event.source !== parent || event.origin !== location.origin ||
        event.data?.type !== "jin-demo") return;
    if (event.data.action !== "pause" && event.data.action !== "play") return;
    requestedPlay = event.data.action === "play";
    updatePlayback();
  });
  document.addEventListener("visibilitychange", updatePlayback);
  selectedTool = "ChatGPT";
  go(0);
  move(phases[phase].target);
  addEventListener("load", () => {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      parent.postMessage({ type: "jin-demo", action: "ready" }, location.origin);
    }));
  }, { once: true });
}
</script></body></html>
